<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bober MiniApp</title>
    <style>
      body { margin:0; font-family: Arial, sans-serif; }
      #miniapp-ui { position: fixed; right: 12px; top: 12px; z-index: 9999; display:flex; gap:8px; }
      .btn { background:#1e90ff; color:#fff; padding:10px 14px; border-radius:8px; cursor:pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
      .btn.secondary { background:#28a745; }
      .status { position: fixed; left:12px; top:12px; z-index:9999; padding:8px 10px; background:rgba(0,0,0,0.6); color:#fff; border-radius:6px; }
      iframe#gameframe { border:0; width:100vw; height:100vh; }
    </style>
  </head>
  <body>
    <div id="miniapp-ui">
      <div id="connect" class="btn">Connect</div>
      <div id="tip" class="btn">Tip 0.01 cUSD</div>
      <div id="mint" class="btn secondary">Mint Badge</div>
    </div>
    <div id="status" class="status">Not connected</div>

    <!-- Load the game from local copy -->
    <iframe id="gameframe" src="game.html" title="Bober Game"></iframe>

    <!-- Ethers from CDN for easy integration; replace with a bundler-based setup in production -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
    <script src="miniapp.js"></script>
  </body>
</html>
